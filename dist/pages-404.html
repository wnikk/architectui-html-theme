<!doctype html>

<html lang="en" data-aui-dark-only="cyberpunk ">
<head>
    <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - Error 404: the page does not exist.</title>
<meta name="description" content="Error 404: the page does not exist.">
<link rel="icon" href="favicon.ico">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="architectui.css">

<script>
(function () {
  var d = document.documentElement, s = {}, m, t;
  try { s = JSON.parse(localStorage.getItem("architectui")) || {}; } catch (e) {}
  if (s.theme === "light" || s.theme === "dark") { s.mode = s.theme; delete s.theme; }
  if (s.theme === "blue") delete s.theme;
  for (var k in s) d.setAttribute("data-aui-" + k, s[k]);
  t = /^[a-z0-9-]+$/.test(s.theme || "") ? s.theme : "";
  m = s.mode || "light";
  if (t) {
    var css = document.querySelector('link[href$="architectui.css"]').getAttribute("href");
    document.write('<link rel="stylesheet" id="aui-theme" href="' + css.replace(/architectui\.css$/, "themes/" + t + ".css") + '">');
    if ((" " + d.getAttribute("data-aui-dark-only") + " ").indexOf(" " + t + " ") > -1) m = "dark";
  }
  if (m === "system") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  d.setAttribute("data-bs-theme", m);
})();
</script>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@1.49.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
<script defer src="architectui.js"></script>

</head>
<body>
    <main id="main">
        <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="display-1 fw-bold text-primary aui-number">404</div>
            <h1 class="h3 mt-3">Page not found</h1>
            <p class="text-body-secondary mb-4">The page was moved or deleted, or the link has a typo. Check the address or go back to the dashboard.</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a href="index.html" class="btn btn-primary d-inline-flex align-items-center gap-2"><i data-lucide="house"></i>Back to dashboard</a>
                <a href="#" class="btn btn-outline-secondary">Contact support</a>
            </div>
        </div>
    </div>
</div>

    </main>
</body>
</html>
