---
title: "Standard Buttons"
description: "Wide selection of buttons that feature different styles for backgrounds, borders and hover options!"
icon: "plane"
---
<div class="row">
    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Solid
                </h5>
                <button class="btn-solid theme-primary mb-3 me-3">Primary
                </button>
                <button class="btn-solid theme-secondary mb-3 me-3">Secondary
                </button>
                <button class="btn-solid theme-success mb-3 me-3">Success
                </button>
                <button class="btn-solid theme-info mb-3 me-3">Info
                </button>
                <button class="btn-solid theme-warning mb-3 me-3">Warning
                </button>
                <button class="btn-solid theme-danger mb-3 me-3">Danger
                </button>
                <button class="btn-solid theme-focus mb-3 me-3">Focus
                </button>
                <button class="btn-solid theme-accent mb-3 me-3">Alt
                </button>
                <button class="btn-solid theme-secondary mb-3 me-3">Light
                </button>
                <button class="btn-solid theme-inverse mb-3 me-3">Dark
                </button>
                <button class="btn-link mb-3 me-3">link
                </button>
            </div>
        </div>
    </div>
    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Color Transition
                </h5>

                </button>
                <button class="btn-subtle theme-info mb-3 me-3">Info
                </button>
                <button class="btn-subtle theme-warning mb-3 me-3">Warning
                </button>
                <button class="btn-subtle theme-danger mb-3 me-3">Danger
                </button>
                <button class="btn-subtle theme-focus mb-3 me-3">Focus
                </button>
                <button class="btn-subtle theme-accent mb-3 me-3">Alt
                </button>
                <button class="btn-subtle theme-secondary mb-3 me-3">Light
                </button>
                <button class="btn-subtle theme-inverse mb-3 me-3">Dark
                </button>
                <button class="btn-subtle mb-3 me-3">link
                </button>
            </div>
        </div>
    </div>
    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Color Transition No Borders

                <button class="btn-subtle theme-secondary mb-3 me-3 border-0">Secondary
                </button>
                <button class="btn-subtle theme-success mb-3 me-3 border-0">Success

                <button class="btn-subtle theme-info mb-3 me-3 border-0">Info

                <button class="btn-subtle theme-warning mb-3 me-3 border-0">Warning
                </button>
                <button class="btn-subtle theme-danger mb-3 me-3 border-0">Danger

                <button class="btn-subtle theme-accent mb-3 me-3 border-0">Alt

                <button class="btn-subtle theme-secondary mb-3 me-3 border-0">Light

    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Active State
                </h5>
                <button class="btn-solid theme-primary mb-3 me-3 active">Primary
                </button>
                <button class="btn-solid theme-secondary mb-3 me-3 active">Secondary
                </button>
                <button class="btn-solid theme-success mb-3 me-3 active">Success
                </button>
                <button class="btn-solid theme-info mb-3 me-3 active">Info
                </button>

                <button class="btn-solid theme-secondary mb-3 me-3 active">Light

    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Disabled State
                </h5>
                <button disabled="" class="btn-solid theme-primary mb-3 me-3 disabled">Primary
                </button>
                <button disabled="" class="btn-solid theme-secondary mb-3 me-3 disabled">Secondary
                </button>
                <button disabled="" class="btn-solid theme-success mb-3 me-3 disabled">Success
                </button>
                <button disabled="" class="btn-solid theme-info mb-3 me-3 disabled">Info
                </button>
                <button disabled="" class="btn-solid theme-warning mb-3 me-3 disabled">Warning
                </button>

    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Block Level
                </h5>
                <div class="d-grid gap-3">
                    <button class="btn-solid theme-primary mb-3 me-3 btn-lg">Block Large
                    </button>
                    <button class="btn-solid theme-primary mb-3 me-3">Block Normal
                    </button>
                    <button class="btn-solid theme-primary mb-3 me-3 btn-sm">Block Small
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Checkbox Buttons
                </h5>
                <div class="text-center">
                    <div role="group" class="btn-group-sm btn-group">
                        <button type="button" class="btn-solid theme-primary">One
                        </button>
                        <button type="button" class="btn-solid theme-primary">Two
                        </button>
                        <button type="button" class="btn-solid theme-primary">Three
                        </button>
                    </div>
                    <hr>
                    <div role="group" class="btn-group">
                        <button type="button" class="btn-solid theme-danger">One
                        </button>
                        <button type="button" class="btn-solid theme-danger">Two
                        </button>
                        <button type="button" class="btn-solid theme-danger">Three
                        </button>
                    </div>
                    <hr>
                    <div role="group" class="btn-group-lg btn-group">
                        <button type="button" class="btn-solid theme-accent">One
                        </button>
                        <button type="button" class="btn-solid theme-accent">Two
                        </button>
                        <button type="button" class="btn-solid theme-accent">Three
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="lg:col-6">
        <div class="mb-5 card">
            <div class="card-body">
                <h5 class="card-title">Radio Buttons
                </h5>
                <div class="text-center">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Basic radio toggle button group">
                        <label class="btn-check btn-solid theme-primary"><input type="radio"  name="btnradio" autocomplete="off" checked>One</label>

                        <label class="btn-check btn-solid theme-primary"><input type="radio"  name="btnradio" autocomplete="off">Two</label>

                        <label class="btn-check btn-solid theme-primary"><input type="radio"  name="btnradio" autocomplete="off">Three</label>
                    </div>
                    <hr>
                    <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                        <label class="btn-check btn-solid theme-warning"><input type="radio"  name="btnradio" autocomplete="off" checked>One</label>

                        <label class="btn-check btn-solid theme-warning"><input type="radio"  name="btnradio" autocomplete="off">Two</label>

                        <label class="btn-check btn-solid theme-warning"><input type="radio"  name="btnradio" autocomplete="off">Three</label>
                    </div>
                    <hr>
                    <div class="btn-group btn-group-lg" role="group" aria-label="Basic radio toggle button group">
                        <label class="btn-check btn-solid theme-focus"><input type="radio"  name="btnradio" autocomplete="off" checked>One</label>

                        <label class="btn-check btn-solid theme-focus"><input type="radio"  name="btnradio" autocomplete="off">Two</label>

                        <label class="btn-check btn-solid theme-focus"><input type="radio"  name="btnradio" autocomplete="off">Three</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
